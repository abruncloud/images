name: Publish Redis backup images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redis-publication
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - run: python3 tools/redis_generate.py --check
      - name: Validate publication metadata and security policy
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - id: matrix
        run: echo "value=$(python3 tools/release.py --image redis matrix --target backup)" >> "$GITHUB_OUTPUT"
  qualify:
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Authenticate CI candidate registry
        uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: backup
        if: matrix.backup
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.directory }}/Dockerfile.backup
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/abruncloud/redis-ci:build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.major }}-${{ matrix.variant }}-${{ matrix.arch }}-backup
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/abruncloud/images
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Test exact backup candidate and recovery on native architecture
        if: matrix.backup
        env:
          RUNTIME: ${{ matrix.base_image }}
          BACKUP: ghcr.io/abruncloud/redis-ci@${{ steps.backup.outputs.digest }}
        run: |
          docker pull "$BACKUP"
          bash tests/run-redis-backup.sh "$BACKUP" "$RUNTIME"
      - name: Scan backup
        if: always() && matrix.backup && steps.backup.outputs.digest != ''
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          version: v0.75.0
          image-ref: ghcr.io/abruncloud/redis-ci@${{ steps.backup.outputs.digest }}
          format: json
          output: scan-backup.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln
          exit-code: '0'
          ignore-unfixed: false
      - name: Retain complete vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.major }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: scan-*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce security policy for every expected artifact
        if: always() && steps.backup.outputs.digest != ''
        env:
          BACKUP_ENABLED: ${{ matrix.backup }}
        run: |
          python3 tools/security_gate.py --policy images/redis/security-policy.json scan-backup.json
      - name: Record qualified digests
        env:
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
          BACKUP_ENABLED: ${{ matrix.backup }}
          MAJOR: ${{ matrix.major }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          if [ "$BACKUP_ENABLED" = true ]; then
            test -n "$BACKUP_DIGEST"
            printf '%s\n' "$BACKUP_DIGEST" > "digests/$MAJOR-$VARIANT-backup-$ARCH"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digests-${{ matrix.major }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests
          retention-days: 90
  promote:
    needs: [metadata, qualify]
    runs-on: ubuntu-24.04
    environment: dockerhub
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Authenticate CI candidate registry
        uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install verified cross-registry copier
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/crane.tar.gz" https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          printf '0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  %s\n' "$RUNNER_TEMP/crane.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/crane-bin"
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/crane-bin" crane
          echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - name: Assemble and sign releases; promote only current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: python3 tools/publish.py --image redis --target backup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          retention-days: 90
      - name: Persist release record beyond artifact retention
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: redis-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Image release $GITHUB_SHA" --notes 'Qualified image digests, exact build inputs and tags are recorded in release.json. Existing deployment digests remain pinned.'
          fi
          gh release upload "$RELEASE_TAG" release.json --clobber
