name: Check database images
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      mysql-matrix: ${{ steps.mysql-matrix.outputs.value }}
      clickhouse-matrix: ${{ steps.clickhouse-matrix.outputs.value }}
      redis-matrix: ${{ steps.redis-matrix.outputs.value }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.13'
      - run: python3 tools/generate.py --check
      - run: python3 tools/mysql_generate.py --check
      - run: python3 tools/redis_generate.py --check
      - run: python3 tools/clickhouse_generate.py --check
      - name: Check tools and tests
        run: |
          python3 -m compileall -q tools
          python3 -m unittest discover -s tests -p 'test_*.py'
          find tests images/postgres images/mysql images/redis images/clickhouse -name '*.sh' -exec bash -n {} ';'
      - id: matrix
        run: echo "value=$(python3 tools/release.py matrix)" >> "$GITHUB_OUTPUT"
      - id: mysql-matrix
        run: echo "value=$(python3 tools/release.py --image mysql matrix --target backup)" >> "$GITHUB_OUTPUT"
      - id: clickhouse-matrix
        run: echo "value=$(python3 tools/release.py --image clickhouse matrix --target backup)" >> "$GITHUB_OUTPUT"
      - id: redis-matrix
        run: echo "value=$(python3 tools/release.py --image redis matrix --target backup)" >> "$GITHUB_OUTPUT"
  native-test:
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.directory }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: abrun-test:runtime
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: matrix.backup
        with:
          context: .
          file: ${{ matrix.directory }}/Dockerfile.backup
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: abrun-test:backup
      - name: Native runtime qualification
        run: bash tests/run.sh abrun-test:runtime
      - name: Native backup and recovery qualification
        if: matrix.backup
        run: bash tests/run-backup.sh abrun-test:backup abrun-test:runtime
  mysql-native-test:
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.mysql-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: matrix.backup
        with:
          context: .
          file: ${{ matrix.directory }}/Dockerfile.backup
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: abrun-mysql-test:backup
      - name: Native backup and recovery qualification
        if: matrix.backup
        run: bash tests/run-mysql-backup.sh abrun-mysql-test:backup "${{ matrix.base_image }}"
  redis-native-test:
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.redis-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: matrix.backup
        with:
          context: .
          file: ${{ matrix.directory }}/Dockerfile.backup
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: abrun-redis-test:backup
      - name: Native backup and recovery qualification
        if: matrix.backup
        run: bash tests/run-redis-backup.sh abrun-redis-test:backup "${{ matrix.base_image }}"
  clickhouse-native-test:
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.clickhouse-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: matrix.backup
        with:
          context: .
          file: ${{ matrix.directory }}/Dockerfile.backup
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: abrun-clickhouse-test:backup
      - name: Native backup and recovery qualification
        if: matrix.backup
        run: bash tests/run-clickhouse-backup.sh abrun-clickhouse-test:backup "${{ matrix.base_image }}"
  required:
    if: always()
    needs: [metadata, native-test, mysql-native-test, redis-native-test, clickhouse-native-test]
    runs-on: ubuntu-24.04
    steps:
      - env:
          METADATA: ${{ needs.metadata.result }}
          TESTS: ${{ needs.native-test.result }}
          MYSQL_TESTS: ${{ needs.mysql-native-test.result }}
          CLICKHOUSE_TESTS: ${{ needs.clickhouse-native-test.result }}
          REDIS_TESTS: ${{ needs.redis-native-test.result }}
        run: test "$METADATA" = success && test "$TESTS" = success && test "$MYSQL_TESTS" = success && test "$REDIS_TESTS" = success && test "$CLICKHOUSE_TESTS" = success
