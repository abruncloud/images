name: Discover upstream updates
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      qualify_update_flow:
        description: Create an owned whitespace-only qualification PR; never auto-merge it
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: redis-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UPDATE_BRANCH: ${{ inputs.qualify_update_flow == true && 'automation/redis-update-qualification' || 'automation/redis-updates' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.13'
      - name: Verify automatic merge branch protection
        if: vars.AUTO_UPDATE_PRS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checks=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'if .protected == true then .protection.required_status_checks.contexts[] else empty end')
          if ! printf '%s\n' "$checks" | grep -Fxq required; then
            echo 'Automatic merge requires main branch protection with the required CI check.' >&2
            exit 1
          fi
      - name: Resolve upstream inputs and generate recipes
        id: discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(python3 tools/redis_discover.py --review-inputs)
          if [ "${{ inputs.qualify_update_flow }}" = true ]; then
            # A manual, harmless trigger qualification; exact image inputs stay identical.
            python3 -c 'from pathlib import Path; p=Path("images/redis/versions.lock.json"); p.write_text(p.read_text()+"\n")'
          else
            python3 tools/redis_discover.py
          fi
          python3 tools/redis_generate.py
          current=$(python3 tools/redis_discover.py --review-inputs)
          if [ "$previous" = "$current" ] && [ "${{ inputs.qualify_update_flow }}" != true ]; then echo "routine=true" >> "$GITHUB_OUTPUT"; else echo "routine=false" >> "$GITHUB_OUTPUT"; fi
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Retain proposed update inputs
        if: steps.discovery.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proposed-redis-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            images/redis/versions.lock.json
            images/redis/generated
          retention-days: 90
      - name: Describe proposed update
        if: steps.discovery.outputs.changed == 'true'
        env:
          PR_AUTOMATION: ${{ vars.AUTO_UPDATE_PRS }}
        run: |
          echo 'Upstream Redis image inputs changed. The proposed lock and generated recipes are attached as a workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$PR_AUTOMATION" != true ]; then
            echo 'Update PR creation is gated. Enable AUTO_UPDATE_PRS=true only after repository and organization permissions permit Actions-created PRs and main requires the required CI check.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open reproducible update PR
        if: steps.discovery.outputs.changed == 'true' && vars.AUTO_UPDATE_PRS == 'true'
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="$UPDATE_BRANCH"
          git config user.name 'abruncloud-images-bot'
          git config user.email 'images-bot@users.noreply.github.com'
          git switch -c "$branch"
          git add images/redis/versions.lock.json images/redis/generated
          git commit -m 'Update qualified Redis build inputs'
          gh auth setup-git
          lease=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          git push "--force-with-lease=refs/heads/$branch:$lease" origin "HEAD:$branch"
          count=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$count" = 0 ]; then
            gh pr create --head "$branch" --title 'Update Redis image inputs' --body 'Automated Redis input discovery or manual whitespace-only flow qualification. Native pull_request checks must pass before merge. GitHub may require maintainer approval to run bot-created PR workflows; workflow_dispatch checks are not a substitute.'
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Await eligible pull request qualification
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.update.outputs.head_sha }}
        run: |
          set -euo pipefail
          branch="$UPDATE_BRANCH"
          # GITHUB_TOKEN-created PRs generate approval-required pull_request runs.
          # workflow_dispatch checks are not accepted as proof for protected PRs.
          run_id=
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow check.yml --branch "$branch" --event pull_request --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo 'No eligible pull_request CI run found for the exact update head. Open the update PR, approve workflows if GitHub requires it, then merge only after the required check passes.' >&2
            exit 1
          fi
          status=$(gh run view "$run_id" --json status,conclusion --jq 'if .status == "waiting" or .conclusion == "action_required" then "approval_required" else .status end')
          if [ "$status" = approval_required ]; then
            echo 'GitHub requires maintainer workflow approval. Approve workflows on the update PR; merge only after its actual pull_request required check passes. No workflow_dispatch or administrator bypass is used.' >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 15
      - name: Merge qualified routine updates and dispatch publication
        if: steps.update.outputs.changed == 'true' && steps.discovery.outputs.routine == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.update.outputs.head_sha }}
        run: |
          set -euo pipefail
          branch="$UPDATE_BRANCH"
          checks=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'if .protected == true then .protection.required_status_checks.contexts[] else empty end')
          if ! printf '%s\n' "$checks" | grep -Fxq required; then
            echo 'Automatic merge requires main branch protection with the required CI check.' >&2
            exit 1
          fi
          # No administrator bypass: normal branch protection still applies.
          # Match the tested head to prevent merging a changed PR.
          gh pr merge "$branch" --squash --match-head-commit "$HEAD_SHA"
          # GITHUB_TOKEN merges do not trigger push workflows either.
          gh workflow run redis-release.yml --ref main
